[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-stackers"
version = "1.6.0"
description = "A persistent motorsport career simulator for iRacing and Automobilista 2."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Circuit Stackers" }
]
dependencies = [
  "customtkinter>=5.2",
  "pillow>=10.0",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
circuit-stackers = "circuit_stackers.cli:main"
ams2-iracing-roster-tool = "ams2_iracing_roster_tool.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuit_stackers = [
  "data/*.csv",
  "assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
